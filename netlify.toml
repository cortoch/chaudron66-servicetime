[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Le site est publié depuis la racine : on masque ce qui n'est pas destiné au navigateur.
[[redirects]]
  from = "/db/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/test/*"
  to = "/404"
  status = 404
  force = true
